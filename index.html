// ==========================================
// Sound Engine
// ==========================================
class SoundEngine {
  constructor(){ this.ctx = null; this.muted = false; this.bgmTimer = null; this.bgmStep = 0; }
  init(){ if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) this.ctx = new AC(); } if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); }
  toggleMute(){ this.muted = !this.muted; if(this.muted) this.stopBGM(); else if(gameState.screen === 'playing') this.startBGM(gameState.mode); return this.muted; }
  playTone(freq, type, dur, vol = 0.18, slideTo = null){
    if(this.muted) return; this.init(); if(!this.ctx) return;
    try {
      const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, now);
      if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
      gain.gain.setValueAtTime(vol, now); gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(now); osc.stop(now + dur);
    } catch(e){}
  }
  startBGM(mode){
    this.stopBGM(); if(this.muted) return; this.init(); this.bgmStep = 0;
    const tempo = mode === 'fps' ? 180 : (mode === 'tag' ? 210 : 280);
    const notes = mode === 'fps'
      ? [196, 246.94, 293.66, 392, 293.66, 246.94, 220, 293.66]
      : [261.63, 329.63, 392, 523.25, 392, 329.63, 293.66, 392];
    this.bgmTimer = setInterval(() => {
      if(this.muted || gameState.screen !== 'playing' || gameState.paused || gameState.bagOpen) return;
      const f = notes[this.bgmStep % notes.length];
      this.playTone(f, mode === 'fps' ? 'square' : 'triangle', 0.15, 0.035);
      this.bgmStep++;
    }, tempo);
  }
  stopBGM(){ if(this.bgmTimer){ clearInterval(this.bgmTimer); this.bgmTimer = null; } }
  playJump(){ this.playTone(260, 'sine', 0.18, 0.2, 540); }
  playDash(){ this.playTone(190, 'sawtooth', 0.22, 0.2, 580); }
  playMorph(){ this.playTone(340, 'sine', 0.12, 0.25, 760); }
  playTaunt(){ [659.25, 783.99, 1046.5].forEach((n, i) => setTimeout(() => this.playTone(n, 'sine', 0.13, 0.22), i * 90)); }
  playPickup(){ this.playTone(880, 'sine', 0.08, 0.18); setTimeout(() => this.playTone(1174.66, 'sine', 0.14, 0.18), 65); }
  playHeal(){ this.playTone(523.25, 'sine', 0.12, 0.2); setTimeout(() => this.playTone(783.99, 'sine', 0.2, 0.2), 90); }
  playDrop(){ this.playTone(420, 'triangle', 0.1, 0.16, 220); }
  playHit(){ this.playTone(150, 'sawtooth', 0.35, 0.32, 48); }
  playShot(){ this.playTone(180, 'square', 0.09, 0.22, 60); this.playTone(900, 'triangle', 0.05, 0.12, 300); }
  playReload(){ this.playTone(300, 'sine', 0.08, 0.15, 200); setTimeout(() => this.playTone(400, 'sine', 0.08, 0.15, 600), 90); }
  playTargetHit(){ this.playTone(1200, 'sine', 0.06, 0.2); setTimeout(() => this.playTone(1600, 'sine', 0.1, 0.18), 40); }
  playWin(){ [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => setTimeout(() => this.playTone(n, 'triangle', 0.35, 0.22), i * 110)); }
  playLose(){ [392, 349.23, 311.13, 261.63].forEach((n, i) => setTimeout(() => this.playTone(n, 'sawtooth', 0.35, 0.18), i * 150)); }
}

function createCharacterMesh(bodyColor, isSeeker = false, team = null){
  const g = new THREE.Group();
  let mainColor = bodyColor;
  if(team === 'blue') mainColor = 0x2563eb;
  if(team === 'red') mainColor = 0xe11d48;

  const skinColor = isSeeker ? 0xfecdd3 : 0xf5d0a9;
  const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.5 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: team === 'red' ? 0x450a0a : (team === 'blue' ? 0x172554 : 0x1e293b), roughness: 0.7 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
  const hairMat = new THREE.MeshStandardMaterial({ color: isSeeker ? 0x1c1917 : 0x3b2a1e, roughness: 0.8 });
  const joints = {};

  [{ key:'L', sign:-1 }, { key:'R', sign:1 }].forEach(({ key, sign }) => {
    const hip = new THREE.Group(); hip.position.set(sign * 0.18, 1.05, 0); g.add(hip);
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.11, 0.55, 10), pantsMat);
    thigh.position.y = -0.275; thigh.castShadow = true; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.55; hip.add(knee);
    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.5, 10), pantsMat);
    shin.position.y = -0.25; shin.castShadow = true; knee.add(shin);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.12, 0.34), shoeMat);
    shoe.position.set(0, -0.56, 0.08); shoe.castShadow = true; knee.add(shoe);
    joints['hip' + key] = hip; joints['knee' + key] = knee;
  });

  const torso = new THREE.Group(); torso.position.y = 1.05; g.add(torso);
  const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.28, 0.82, 12), bodyMat);
  chest.position.y = 0.42; chest.castShadow = true; torso.add(chest);

  [{ key:'L', sign:-1 }, { key:'R', sign:1 }].forEach(({ key, sign }) => {
    const shoulder = new THREE.Group(); shoulder.position.set(sign * 0.36, 1.78, 0); g.add(shoulder);
    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.08, 0.45, 10), bodyMat);
    upper.position.y = -0.225; upper.castShadow = true; shoulder.add(upper);
    const elbow = new THREE.Group(); elbow.position.y = -0.45; shoulder.add(elbow);
    const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.07, 0.4, 10), skinMat);
    fore.position.y = -0.2; fore.castShadow = true; elbow.add(fore);
    joints['shoulder' + key] = shoulder; joints['elbow' + key] = elbow;
  });

  const headGroup = new THREE.Group(); headGroup.position.y = 2.02; g.add(headGroup);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 18), skinMat);
  head.scale.set(0.92, 1.08, 0.95); head.position.y = 0.14; head.castShadow = true; headGroup.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.65), hairMat);
  hair.scale.set(0.94, 1.08, 0.97); hair.position.y = 0.17; headGroup.add(hair);

  if(team){
    const visorMat = new THREE.MeshStandardMaterial({
      color: team === 'blue' ? 0x38bdf8 : 0xf43f5e,
      emissive: team === 'blue' ? 0x0284c7 : 0xe11d48,
      emissiveIntensity: 0.8, roughness: 0.2
    });
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.1, 0.12), visorMat);
    visor.position.set(0, 0.16, 0.2); headGroup.add(visor);
  } else {
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const pupilMat = new THREE.MeshStandardMaterial({ color: isSeeker ? 0xf43f5e : 0x1e293b });
    [-0.08, 0.08].forEach(ex => {
      const white = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeWhiteMat);
      white.position.set(ex, 0.15, 0.19); headGroup.add(white);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 6), pupilMat);
      pupil.position.set(ex, 0.15, 0.22); headGroup.add(pupil);
    });
  }

  if(isSeeker){
    const hornMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.4 });
    [-0.15, 0.15].forEach(hx => {
      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.32, 10), hornMat);
      horn.position.set(hx, 0.4, 0); horn.rotation.z = hx > 0 ? -0.25 : 0.25; headGroup.add(horn);
    });
  }

  g.userData.joints = joints;
  g.userData.walkPhase = 0;
  return g;
}

function animateCharacter(charMesh, dt, moveSpeed, isGrounded){
  const joints = charMesh.userData.joints;
  if(!joints) return;
  if(moveSpeed > 0.3 && isGrounded) charMesh.userData.walkPhase += dt * moveSpeed * 2.8;
  else charMesh.userData.walkPhase *= 0.9;
  const swing = Math.sin(charMesh.userData.walkPhase);
  if(joints.hipL && joints.hipR){
    joints.hipL.rotation.x = swing * 0.55;
    joints.hipR.rotation.x = -swing * 0.55;
    joints.kneeL.rotation.x = Math.max(0, -swing) * 0.7;
    joints.kneeR.rotation.x = Math.max(0, swing) * 0.7;
  }
  if(joints.shoulderL && joints.shoulderR){
    joints.shoulderL.rotation.x = -swing * 0.45;
    joints.shoulderR.rotation.x = swing * 0.45;
  }
}

function shouldShowNametagForRemote(remotePlayerData){
  if(!remotePlayerData) return false;
  if(gameState.mode === 'prophunt'){
    if(remotePlayerData.role !== 'seeker') return false;
  }
  if(gameState.mode === 'fps'){
    if(remotePlayerData.team && remotePlayerData.team !== gameState.fps.team) return false;
  }
  return true;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function createRobloxNametagSprite(username, team = null, hp = 100, maxHp = 100){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 88;
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sprite.scale.set(2.5, 0.68, 1);
  sprite.userData.isNametag = true; sprite.userData.canvas = canvas; sprite.userData.tex = tex;
  updateRobloxNametag(sprite, username, team, hp, maxHp);
  return sprite;
}

function updateRobloxNametag(sprite, username, team = null, hp = 100, maxHp = 100){
  if(!sprite || !sprite.userData.canvas) return;
  const canvas = sprite.userData.canvas, c = canvas.getContext('2d');
  c.clearRect(0, 0, canvas.width, canvas.height);
  let nameColor = '#ffffff', prefix = '';
  if(team === 'blue'){ nameColor = '#7dd3fc'; prefix = '[BLUE] '; }
  if(team === 'red'){ nameColor = '#fda4af'; prefix = '[RED] '; }
  const displayText = prefix + (username || 'Player');
  c.font = '900 28px "M PLUS Rounded 1c", sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = 6; c.strokeStyle = 'rgba(0,0,0,0.9)'; c.strokeText(displayText, 160, 30);
  c.fillStyle = nameColor; c.fillText(displayText, 160, 30);
  if(maxHp > 0 && team !== null){
    const barW = 140, barH = 12, bx = (320 - barW) / 2, by = 52;
    const ratio = Math.max(0, Math.min(1, hp / maxHp));
    c.fillStyle = 'rgba(15,23,42,0.85)';
    roundRect(c, bx - 2, by - 2, barW + 4, barH + 4, 6); c.fill();
    let barColor = '#22c55e';
    if(ratio <= 0.5) barColor = '#eab308';
    if(ratio <= 0.25) barColor = '#ef4444';
    if(ratio > 0){ c.fillStyle = barColor; roundRect(c, bx, by, barW * ratio, barH, 4); c.fill(); }
  }
  sprite.userData.tex.needsUpdate = true;
}

function attachNametag(mesh, text, team = null, hp = 100, maxHp = 100, yOffset = 2.75, visible = true){
  if(!mesh) return null;
  if(mesh.userData.nametag){
    mesh.userData.nametag.position.set(0, yOffset, 0);
    mesh.userData.nametag.visible = visible;
    updateRobloxNametag(mesh.userData.nametag, text, team, hp, maxHp);
    return mesh.userData.nametag;
  }
  const tag = createRobloxNametagSprite(text, team, hp, maxHp);
  tag.position.set(0, yOffset, 0);
  tag.visible = visible;
  mesh.add(tag); mesh.userData.nametag = tag;
  return tag;
}

function addBoxCollider(cx, cz, w, d, h = 3){
  colliders.push({
    minX: cx - w / 2, maxX: cx + w / 2,
    minZ: cz - d / 2, maxZ: cz + d / 2,
    height: h
  });
}

function spawnWorldProp(typeId, x, y, z, rotY, isMorphTarget){
  const def = PROP_DEFS[typeId];
  if(!def) return null;
  const mesh = createProp3DMesh(typeId);
  mesh.position.set(x, y, z);
  mesh.rotation.y = rotY || 0;
  worldGroup.add(mesh);
  const prop = { typeId, def, mesh, x, z, rotY };
  propsList.push(prop);
  if(!def.walkableTop) addBoxCollider(x, z, def.boxW, def.boxD, def.height);
  return prop;
}

function pushToast(text, colorClass = 'text-slate-200'){
  const feed = document.getElementById('toast-feed');
  if(!feed) return;
  const el = document.createElement('div');
  el.className = `px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700 text-xs font-black ${colorClass} shadow-lg`;
  el.textContent = text;
  feed.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 2200);
  setTimeout(() => { el.remove(); }, 2700);
}

const canvasEl = renderer.domElement;

function requestPointerLock(){
  if(!document.pointerLockElement && gameState.screen === 'playing' && !gameState.paused && !gameState.bagOpen){
    try {
      if(canvasEl && typeof canvasEl.requestPointerLock === 'function'){
        const p = canvasEl.requestPointerLock();
        if(p && p.catch) p.catch(() => {});
      }
    } catch(e){}
  }
}
function exitPointerLock(){
  if(document.pointerLockElement){
    try { if(typeof document.exitPointerLock === 'function') document.exitPointerLock(); } catch(e){}
  }
}
function isPointerLocked(){ return document.pointerLockElement === canvasEl; }
function enterPlayingMode(){
  if(!gameState.bagOpen && !gameState.paused){
    document.body.classList.add('cursor-hidden');
    requestPointerLock();
    hideClickHint();
  }
}
function leavePlayingMode(){
  document.body.classList.remove('cursor-hidden');
  exitPointerLock();
  hideClickHint();
}
const clickHintEl = document.getElementById('click-hint');
function showClickHint(){
  if(gameState.screen === 'playing' && !gameState.paused && !gameState.bagOpen && !isPointerLocked()) clickHintEl.classList.add('show');
}
function hideClickHint(){ clickHintEl.classList.remove('show'); }

function canUseGun(){
  if(gameState.mode === 'fps') return Boolean(getCurrentWeaponDef());
  if(gameState.mode === 'prophunt' && gameState.phRole === 'seeker') return true;
  return false;
}

canvasEl.addEventListener('mousedown', (e) => {
  if(e.button !== 0 || gameState.bagOpen) return;
  if(gameState.screen === 'playing' && !gameState.paused && !isPointerLocked()) requestPointerLock();
  if(gameState.screen === 'playing' && !gameState.paused){
    if(gameState.mode === 'fps' && getCurrentHealDef()){
      useSelectedHeal();
      return;
    }
    if(canUseGun()) shootGun();
  }
});

document.addEventListener('pointerlockchange', () => {
  if(isPointerLocked()){ hideClickHint(); document.body.classList.add('cursor-hidden'); }
  else if(gameState.screen === 'playing' && !gameState.paused && !gameState.bagOpen){
    showClickHint(); document.body.classList.remove('cursor-hidden');
  }
});

document.addEventListener('mousemove', (e) => {
  if(gameState.screen !== 'playing' || gameState.paused || gameState.bagOpen || !isPointerLocked()) return;
  const dx = e.movementX || 0, dy = e.movementY || 0;
  if(canUseGun() || gameState.mode === 'fps'){
    player.fpsYaw -= dx * 0.0022;
    player.fpsPitch = Math.max(-1.35, Math.min(1.35, player.fpsPitch - dy * 0.0022));
  } else {
    camCtrl.yaw -= dx * 0.004;
    camCtrl.pitch = Math.max(-0.2, Math.min(1.3, camCtrl.pitch + dy * 0.004));
  }
});

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if(e.code === 'Escape' && gameState.screen === 'playing'){
    e.preventDefault();
    if(gameState.bagOpen){ closeBagModal(); return; }
    if(gameState.paused) resumeGame(); else pauseGame();
    return;
  }
  if(gameState.screen !== 'playing' || gameState.paused || gameState.bagOpen) return;
  if(e.code >= 'Digit1' && e.code <= 'Digit5') selectHotbarSlot(Number(e.code.slice(-1)) - 1);
  if(e.code === 'KeyG') dropHotbarSlotItem(gameState.fps.selectedSlot);
  if(e.code === 'KeyB') openBagModal();
  if(e.code === 'KeyH') useSelectedHeal();
  if(e.code === 'KeyE') triggerInteractE();
  if(e.code === 'KeyR') startReload();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function getActivePlayersInServer(serverData){
  const now = Date.now();
  const presence = serverData?.presence || {};
  const list = [];
  Object.entries(presence).forEach(([uid, p]) => {
    if(p && (now - (p.updatedAt || 0) < 20000)) list.push({ uid, ...p });
  });
  return list;
}

function getActiveOnlinePlayers(){
  const now = Date.now();
  const list = [];
  Object.entries(APP.latestPresence || {}).forEach(([uid, p]) => {
    if(p && (now - (p.updatedAt || 0) < 20000)) list.push({ uid, ...p });
  });
  return list;
}

function selectOptimalServer(serversMap){
  const candidates = ['server-01', 'server-02', 'server-03'];
  let bestWithPlayers = null;
  let bestCount = -1;
  for(const sid of candidates){
    const active = getActivePlayersInServer(serversMap?.[sid]).filter(p => p.uid !== APP.profile?.uid);
    const count = active.length;
    if(count > 0 && count < SERVER_MAX_CAPACITY && count > bestCount){ bestCount = count; bestWithPlayers = sid; }
  }
  if(bestWithPlayers) return bestWithPlayers;
  for(const sid of candidates){
    const active = getActivePlayersInServer(serversMap?.[sid]).filter(p => p.uid !== APP.profile?.uid);
    if(active.length < SERVER_MAX_CAPACITY) return sid;
  }
  return 'server-01';
}

function assignBalancedTeam(){
  let blueHumans = 0, redHumans = 0;
  const now = Date.now();
  Object.entries(APP.latestPlayers || {}).forEach(([uid, p]) => {
    if(uid === APP.profile?.uid) return;
    if(p && p.mode === 'fps' && (now - (p.updatedAt || 0) < 20000)){
      if(p.team === 'blue') blueHumans++;
      else if(p.team === 'red') redHumans++;
    }
  });
  if(blueHumans < redHumans) return 'blue';
  if(redHumans < blueHumans) return 'red';
  return Math.random() < 0.5 ? 'blue' : 'red';
}

function computeElapsedSeconds(matchObj){
  if(!matchObj || matchObj.status !== 'playing') return 0;
  if(typeof matchObj.startedAt === 'number' && matchObj.startedAt > 0) return Math.max(0, (Date.now() - matchObj.startedAt) / 1000);
  const duration = matchObj.duration || getDurationForMode(matchObj.mode);
  return Math.max(0, duration - (matchObj.timer || duration));
}
function computeRemainingSeconds(matchObj){
  if(!matchObj || matchObj.status !== 'playing') return FPS_MATCH_DURATION_SEC;
  const duration = matchObj.duration || getDurationForMode(matchObj.mode);
  return Math.max(0, duration - computeElapsedSeconds(matchObj));
}

function refreshLobbyMatchUI(){
  const online = getActiveOnlinePlayers();
  const count = Math.max(1, online.length);
  document.getElementById('hud-online-count').textContent = `オンライン: ${count}人`;
  document.getElementById('lobby-online-badge').textContent = `🌐 ${APP.serverId} (${count}人接続中)`;
  document.getElementById('hud-role-sub').textContent = `サーバー: ${APP.serverId}`;

  const names = online.map(p => `${p.username}${p.mode && p.mode !== 'lobby' ? `(${p.mode.toUpperCase()})` : ''}`).join(' / ');
  document.getElementById('live-players-list').textContent = names ? `同サーバー参加者: ${names}` : 'いつでも即プレイ可能';

  const m = APP.latestMatch;
  const quickBtn = document.getElementById('btn-quick-join-match');
  const badge = document.getElementById('live-match-status-badge');
  const titleEl = document.getElementById('live-match-title');
  const rem = computeRemainingSeconds(m);
  const isMatchActive = m && m.status === 'playing' && rem > 2 && (Date.now() - (m.heartbeatAt || m.updatedAt || 0) < 20000);
  if(isMatchActive){
    const modeLabel = m.mode === 'fps' ? 'チームFPS' : (m.mode === 'tag' ? '鬼ごっこ(2分)' : '変身かくれんぼ');
    const min = Math.floor(rem / 60);
    const sec = Math.floor(rem % 60).toString().padStart(2, '0');
    badge.textContent = '試合開催中';
    badge.className = 'px-2 py-0.5 rounded-md text-[10px] font-black bg-amber-500/20 text-amber-300 border border-amber-500/40';
    titleEl.textContent = `[${APP.serverId}] ${modeLabel} 進行中（残り ${min}:${sec}）`;
    quickBtn.classList.remove('hidden');
    quickBtn.onclick = () => startGame(m.mode, true);
  } else {
    badge.textContent = 'サーバー準備OK';
    badge.className = 'px-2 py-0.5 rounded-md text-[10px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
    titleEl.textContent = `[${APP.serverId}] オンラインサーバー待機中（いつでも参加可能）`;
    quickBtn.classList.add('hidden');
  }
}

function initServerAutoAllocator(){
  if(!APP.ready || !window.FB) return;
  try {
    window.FB.onValue(window.FB.rtRef(window.FB.rtdb, 'servers'), (snap) => {
      APP.allServers = snap.val() || {};
      APP.serverId = selectOptimalServer(APP.allServers);
      refreshLobbyMatchUI();
    });
    window.FB.onValue(window.FB.rtRef(window.FB.rtdb, `servers/${APP.serverId}/presence`), (snap) => {
      APP.latestPresence = snap.val() || {};
      refreshLobbyMatchUI();
    });
    window.FB.onValue(window.FB.rtRef(window.FB.rtdb, `servers/${APP.serverId}/match`), (snap) => {
      APP.latestMatch = snap.val();
      refreshLobbyMatchUI();
    });
  } catch(e){ console.warn('sync init fallback', e); }
}

function syncPresenceToServer(){
  if(!APP.ready || !window.FB || !APP.profile) return;
  try {
    const pRef = window.FB.rtRef(window.FB.rtdb, `servers/${APP.serverId}/presence/${APP.profile.uid}`);
    window.FB.rtSet(pRef, {
      uid: APP.profile.uid,
      username: APP.profile.username,
      mode: gameState.screen === 'playing' ? gameState.mode : 'lobby',
      team: gameState.fps.team,
      pos: { x: player.pos.x, y: player.pos.y, z: player.pos.z },
      yaw: gameState.mode === 'fps' ? player.fpsYaw : camCtrl.yaw,
      hp: gameState.mode === 'fps' ? gameState.fps.hp : 3,
      role: gameState.mode === 'prophunt' ? gameState.phRole : (gameState.mode === 'tag' ? gameState.tagRole : null),
      updatedAt: Date.now()
    });
    window.FB.onDisconnect(pRef).remove();
  } catch(e){}
}
function stopActiveMatchSync(){
  if(!APP.ready || !window.FB || !APP.profile) return;
  try { window.FB.rtRemove(window.FB.rtRef(window.FB.rtdb, `servers/${APP.serverId}/presence/${APP.profile.uid}`)); } catch(e){}
}

function build3DWorld(mode){
  scene.remove(worldGroup);
  worldGroup.traverse(obj => {
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material){
      if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  colliders = []; propsList = []; jumpPads = []; coinsList = []; seekersList = []; runnersList = []; fxList = []; fpsBots = [];
  supplyChests = []; ammoCrates = []; droppedWorldItems = [];
  Object.values(remotePlayers).forEach(rp => { if(rp.mesh) worldGroup.remove(rp.mesh); });
  remotePlayers = {};

  if(mode === 'fps'){ buildFPSBattleArena(); return; }

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_HALF * 2, ARENA_HALF * 2), new THREE.MeshStandardMaterial({ color:0x14532d, roughness:0.9 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; worldGroup.add(ground);

  const plaza = new THREE.Mesh(new THREE.CylinderGeometry(22, 22, 0.05, 48), new THREE.MeshStandardMaterial({ color:0x334155, roughness:0.7 }));
  plaza.position.y = 0.025; plaza.receiveShadow = true; worldGroup.add(plaza);

  const fenceMat = new THREE.MeshStandardMaterial({ color:0x78350f, roughness:0.8 });
  [
    { x:0, z:-ARENA_HALF, w:ARENA_HALF*2+1, d:1.5 }, { x:0, z:ARENA_HALF, w:ARENA_HALF*2+1, d:1.5 },
    { x:-ARENA_HALF, z:0, w:1.5, d:ARENA_HALF*2+1 }, { x:ARENA_HALF, z:0, w:1.5, d:ARENA_HALF*2+1 }
  ].forEach(pw => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(pw.w, 5.0, pw.d), fenceMat);
    m.position.set(pw.x, 2.5, pw.z); m.castShadow = true; worldGroup.add(m);
  });

  [
    { x:-30, z:-45 }, { x:30, z:45 }, { x:-45, z:30 }, { x:45, z:-30 },
    { x:-75, z:0 }, { x:75, z:0 }, { x:0, z:-75 }, { x:0, z:75 },
    { x:-70, z:-70 }, { x:70, z:70 }, { x:-70, z:70 }, { x:70, z:-70 }
  ].forEach(jp => {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 0.24, 18),
      new THREE.MeshStandardMaterial({ color:0x10b981, emissive:0x059669, emissiveIntensity:0.65 }));
    pad.position.set(jp.x, 0.12, jp.z); worldGroup.add(pad);
    jumpPads.push({ x:jp.x, z:jp.z, radius:1.8, mesh:pad });
  });

  if(mode === 'prophunt'){ buildSeekerVoidRoom(); buildPropHuntObstacles(); }
  else { buildTagObstacles(); }
}

function buildSeekerVoidRoom(){
  const vx = VOID_ROOM_POS.x, vy = VOID_ROOM_POS.y, vz = VOID_ROOM_POS.z;
  const roomFloor = new THREE.Mesh(new THREE.BoxGeometry(30, 1, 30), new THREE.MeshStandardMaterial({ color:0x1e1b4b, roughness:0.6, metalness:0.3 }));
  roomFloor.position.set(vx, vy - 0.5, vz); worldGroup.add(roomFloor);
  const ring = new THREE.Mesh(new THREE.RingGeometry(4.5, 5.8, 32), new THREE.MeshBasicMaterial({ color:0xf43f5e, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(vx, vy + 0.05, vz); worldGroup.add(ring);
  const wallMat = new THREE.MeshStandardMaterial({ color:0x312e81, roughness:0.5 });
  [
    { x:vx, z:vz-15, w:30, d:1 }, { x:vx, z:vz+15, w:30, d:1 },
    { x:vx-15, z:vz, w:1, d:30 }, { x:vx+15, z:vz, w:1, d:30 }

function openSupplyChest(chestObj){
  const idx = supplyChests.indexOf(chestObj);
  if(idx === -1) return;
  worldGroup.remove(chestObj.mesh);
  supplyChests.splice(idx, 1);

  const { weaponId, heals, ammoType, ammoCount } = chestObj.loot;
  const wDef = WEAPON_DEFS[weaponId];
  const aDef = AMMO_DEFS[ammoType];
  const addedGun = addItemToHotbar('weapon', weaponId);
  let addedHealCount = 0;
  heals.forEach(hId => { if(addItemToHotbar('heal', hId)) addedHealCount++; });
  gameState.fps.ammoPool[ammoType] = (gameState.fps.ammoPool[ammoType] || 0) + ammoCount;
  sound.playPickup();
  updateFPSHUD();
  const healNames = heals.map(id => HEAL_DEFS[id].name).join('＆');
  pushToast(`🎁 宝箱！ ${wDef.icon}${wDef.name}${addedGun ? '' : '(枠満)'} / ${healNames}(${addedHealCount}) / ${aDef.name}+${ammoCount}`, 'text-amber-300');
}

function openAmmoCrate(crateObj){
  const idx = ammoCrates.indexOf(crateObj);
  if(idx === -1) return;
  worldGroup.remove(crateObj.mesh);
  ammoCrates.splice(idx, 1);
  Object.keys(AMMO_DEFS).forEach(k => { gameState.fps.ammoPool[k] = (gameState.fps.ammoPool[k] || 0) + crateObj.ammoEach; });
  sound.playPickup();
  updateFPSHUD();
  pushToast(`🔋 弾薬箱！ 全種類の弾を${crateObj.ammoEach}発ずつ入手！`, 'text-sky-300');
}

function collectDroppedItem(dropObj){
  const idx = droppedWorldItems.indexOf(dropObj);
  if(idx === -1) return;
  if(dropObj.kind === 'ammo'){
    gameState.fps.ammoPool[dropObj.itemId] = (gameState.fps.ammoPool[dropObj.itemId] || 0) + dropObj.count;
    worldGroup.remove(dropObj.mesh);
    droppedWorldItems.splice(idx, 1);
    sound.playPickup();
    updateFPSHUD();
    pushToast(`🔹 ${AMMO_DEFS[dropObj.itemId].name} ×${dropObj.count} を回収！`, 'text-amber-300');
  } else {
    if(addItemToHotbar(dropObj.kind, dropObj.itemId)){
      worldGroup.remove(dropObj.mesh);
      droppedWorldItems.splice(idx, 1);
      sound.playPickup();
      const def = dropObj.kind === 'weapon' ? WEAPON_DEFS[dropObj.itemId] : HEAL_DEFS[dropObj.itemId];
      pushToast(`✨ ${def.icon}${def.name} を回収！`, 'text-emerald-300');
    }
  }
}

function updatePickupsAndProximity(dt){
  const time = performance.now() * 0.003;
  supplyChests.forEach(c => {
    if(c.beacon) c.beacon.rotation.y = time;
    if(Math.hypot(player.pos.x - c.x, player.pos.z - c.z) < 2.3) openSupplyChest(c);
  });
  ammoCrates.forEach(c => {
    if(c.beacon) c.beacon.rotation.y = -time;
    if(Math.hypot(player.pos.x - c.x, player.pos.z - c.z) < 2.3) openAmmoCrate(c);
  });
  for(let i = droppedWorldItems.length - 1; i >= 0; i--){
    const d = droppedWorldItems[i];
    d.age += dt;
    if(d.age > 0.8 && Math.hypot(player.pos.x - d.x, player.pos.z - d.z) < 2.2) collectDroppedItem(d);
  }

  let nearPickup = null;
  for(const c of supplyChests){
    if(Math.hypot(player.pos.x - c.x, player.pos.z - c.z) < 3.6){ nearPickup = { type:'chest', ref:c, label:'宝箱回収（銃1・回復2・弾70発）' }; break; }
  }
  if(!nearPickup){
    for(const ac of ammoCrates){
      if(Math.hypot(player.pos.x - ac.x, player.pos.z - ac.z) < 3.6){ nearPickup = { type:'ammoCrate', ref:ac, label:'弾薬箱回収（全弾60発ずつ）' }; break; }
    }
  }
  const promptEl = document.getElementById('target-prompt'), promptText = document.getElementById('target-prompt-text');
  if(nearPickup){
    player.targetedPickup = nearPickup;
    promptText.textContent = nearPickup.label;
    promptEl.classList.remove('opacity-0');
    return;
  }
  player.targetedPickup = null;
  promptEl.classList.add('opacity-0');
}

function triggerInteractE(){
  if(gameState.screen !== 'playing' || gameState.paused || gameState.bagOpen) return;
  if(player.targetedPickup){
    if(player.targetedPickup.type === 'chest') openSupplyChest(player.targetedPickup.ref);
    else if(player.targetedPickup.type === 'ammoCrate') openAmmoCrate(player.targetedPickup.ref);
    player.targetedPickup = null;
    return;
  }
  if(gameState.mode === 'prophunt' && gameState.phRole === 'hider') triggerMorph();
}

function getCurrentWeaponDef(){
  const slot = gameState.fps.slots[gameState.fps.selectedSlot];
  if(slot && slot.kind === 'weapon' && WEAPON_DEFS[slot.itemId]) return WEAPON_DEFS[slot.itemId];
  return null;
}
function getCurrentHealDef(){
  const slot = gameState.fps.slots[gameState.fps.selectedSlot];
  if(slot && slot.kind === 'heal' && HEAL_DEFS[slot.itemId]) return HEAL_DEFS[slot.itemId];
  return null;
}

function addItemToHotbar(kind, itemId){
  const emptyIdx = gameState.fps.slots.findIndex(s => s === null);
  if(emptyIdx === -1){
    pushToast('⚠️ 5枠すべて埋まっています！', 'text-rose-300');
    return false;
  }
  gameState.fps.slots[emptyIdx] = { kind, itemId };
  if(kind === 'weapon' && WEAPON_DEFS[itemId]) gameState.fps.magAmmo[itemId] = WEAPON_DEFS[itemId].magSize;
  renderHotbarUI();
  rebuildGunMeshForCurrentSlot();
  return true;
}

function useSelectedHeal(){
  if(gameState.mode !== 'fps' || gameState.screen !== 'playing' || gameState.paused) return;
  const idx = gameState.fps.selectedSlot;
  const slot = gameState.fps.slots[idx];
  if(!slot || slot.kind !== 'heal' || !HEAL_DEFS[slot.itemId]) return;
  if(gameState.fps.hp >= gameState.fps.maxHp){ pushToast('❤️ HP満タン', 'text-emerald-300'); return; }
  const hDef = HEAL_DEFS[slot.itemId];
  gameState.fps.hp = Math.min(gameState.fps.maxHp, gameState.fps.hp + hDef.healAmount);
  gameState.fps.slots[idx] = null;
  sound.playHeal();
  pushToast(`💚 ${hDef.name} 使用 HP+${hDef.healAmount}（現在 ${gameState.fps.hp}）`, 'text-emerald-300');
  renderHotbarUI();
  updateFPSHUD();
}

function dropHotbarSlotItem(slotIndex){
  if(gameState.mode !== 'fps' || gameState.screen !== 'playing' || gameState.paused) return;
  const slot = gameState.fps.slots[slotIndex];
  if(!slot) return;
  const def = slot.kind === 'weapon' ? WEAPON_DEFS[slot.itemId] : HEAL_DEFS[slot.itemId];
  if(!def) return;
  const forward = new THREE.Vector3(-Math.sin(player.fpsYaw), 0, -Math.cos(player.fpsYaw));
  const dropPos = player.pos.clone().addScaledVector(forward, 1.8);
  dropPos.y = 0;
  spawnDroppedWorldItem(slot.kind, slot.itemId, 1, dropPos.x, dropPos.z);
  gameState.fps.slots[slotIndex] = null;
  sound.playDrop();
  pushToast(`📤 ${def.name} をドロップ`, 'text-amber-300');
  renderHotbarUI();
  rebuildGunMeshForCurrentSlot();
  if(gameState.bagOpen) renderBagUI();
}

function dropAmmoType(ammoType, amount = 30){
  if(gameState.mode !== 'fps' || gameState.screen !== 'playing' || gameState.paused) return;
  const current = gameState.fps.ammoPool[ammoType] || 0;
  if(current <= 0){ pushToast('⚠️ 落とせる弾薬なし', 'text-rose-300'); return; }
  const dropCount = Math.min(current, amount);
  gameState.fps.ammoPool[ammoType] = current - dropCount;
  const forward = new THREE.Vector3(-Math.sin(player.fpsYaw), 0, -Math.cos(player.fpsYaw));
  const dropPos = player.pos.clone().addScaledVector(forward, 1.8);
  dropPos.y = 0;
  spawnDroppedWorldItem('ammo', ammoType, dropCount, dropPos.x, dropPos.z);
  sound.playDrop();
  pushToast(`📤 ${AMMO_DEFS[ammoType].name} ×${dropCount} をドロップ`, 'text-amber-300');
  updateFPSHUD();
  if(gameState.bagOpen) renderBagUI();
}

function selectHotbarSlot(index){
  if(index < 0 || index > 4) return;
  gameState.fps.selectedSlot = index;
  renderHotbarUI();
  rebuildGunMeshForCurrentSlot();
  updateFPSHUD();
}

function renderHotbarUI(){
  const containerEl = document.getElementById('hotbar-slots');
  if(!containerEl) return;
  containerEl.innerHTML = '';
  for(let i = 0; i < 5; i++){
    const slot = gameState.fps.slots[i];
    const isSelected = (gameState.fps.selectedSlot === i);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `hotbar-slot relative w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-slate-900/90 border-2 ${isSelected ? 'selected border-amber-400' : 'border-slate-700'} flex flex-col items-center justify-center transition-all cursor-pointer`;
    btn.innerHTML = `<span class="absolute top-0.5 left-1.5 text-[10px] font-black text-slate-400">${i + 1}</span>`;
    if(!slot){
      btn.innerHTML += `<span class="text-[10px] font-bold text-slate-600">空き</span>`;
    } else if(slot.kind === 'weapon' && WEAPON_DEFS[slot.itemId]){
      const w = WEAPON_DEFS[slot.itemId];
      btn.innerHTML += `<span class="text-xl leading-none">${w.icon}</span><span class="text-[9px] font-black text-sky-200 mt-1 truncate max-w-full px-1">${w.name.replace('アサルト', '')}</span>`;
    } else if(slot.kind === 'heal' && HEAL_DEFS[slot.itemId]){
      const h = HEAL_DEFS[slot.itemId];
      btn.innerHTML += `<span class="text-xl leading-none">${h.icon}</span><span class="text-[9px] font-black text-emerald-300 mt-1">${h.healAmount}HP</span>`;
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();

// ==========================================
// 射撃・リロード
// ==========================================
function startReload(){
  const w = getCurrentWeaponDef();
  if(!w) return;
  const cur = gameState.fps.magAmmo[w.id] || 0;
  if(cur >= w.magSize) return;
  if((gameState.fps.ammoPool[w.ammoType] || 0) <= 0) return;
  gameState.fps.reloadTimer = 1.2;
  sound.playReload();
}
function finishReload(){
  const w = getCurrentWeaponDef();
  if(!w) return;
  const cur = gameState.fps.magAmmo[w.id] || 0;
  const need = w.magSize - cur;
  const pool = gameState.fps.ammoPool[w.ammoType] || 0;
  const take = Math.min(need, pool);
  gameState.fps.magAmmo[w.id] = cur + take;
  gameState.fps.ammoPool[w.ammoType] = pool - take;
  updateFPSHUD();
}

function shootGun(){
  if(gameState.fps.fireCooldown > 0 || gameState.fps.reloadTimer > 0) return;
  const w = getCurrentWeaponDef();
  if(!w) return;
  const mag = gameState.fps.magAmmo[w.id] || 0;
  if(mag <= 0){ startReload(); return; }
  gameState.fps.magAmmo[w.id] = mag - 1;
  gameState.fps.fireCooldown = w.fireCooldown;
  sound.playShot();

  const raycaster = new THREE.Raycaster();
  const dir = new THREE.Vector3(
    -Math.sin(player.fpsYaw) * Math.cos(player.fpsPitch),
    Math.sin(player.fpsPitch),
    -Math.cos(player.fpsYaw) * Math.cos(player.fpsPitch)
  );
  raycaster.set(camera.position, dir);
  const hits = raycaster.intersectObjects(worldGroup.children, true);
  for(const h of hits){
    const rp = h.object.userData.remotePlayerRef;
    if(rp){
      rp.hp = Math.max(0, (rp.hp || 100) - w.damageBody);
      document.getElementById('fps-crosshair').classList.add('hit');
      setTimeout(() => document.getElementById('fps-crosshair').classList.remove('hit'), 120);
      sound.playTargetHit();
      break;
    }
    if(h.object.userData.pickupRef) break;
  }
  updateFPSHUD();
}

function updateFPSHUD(){
  const w = getCurrentWeaponDef();
  const mag = w ? (gameState.fps.magAmmo[w.id] || 0) : 0;
  const pool = w ? (gameState.fps.ammoPool[w.ammoType] || 0) : 0;
  const ammoEl = document.getElementById('fps-ammo');
  if(ammoEl) ammoEl.innerHTML = `${mag} <small>/ ${pool}</small>`;
  const labelEl = document.getElementById('fps-weapon-label');
  if(labelEl) labelEl.textContent = w ? w.name : '素手';
  const hp = gameState.fps.hp;
  const hpText = document.getElementById('hud-fps-hp-text');
  if(hpText) hpText.textContent = hp;
  const hpBar = document.getElementById('hud-fps-hp-bar');
  if(hpBar) hpBar.style.width = `${(hp / gameState.fps.maxHp) * 100}%`;
  const blueEl = document.getElementById('hud-blue-score');
  if(blueEl) blueEl.textContent = gameState.fps.blueScore;
  const redEl = document.getElementById('hud-red-score');
  if(redEl) redEl.textContent = gameState.fps.redScore;
  const badge = document.getElementById('fps-team-badge');
  if(badge){
    badge.textContent = gameState.fps.team === 'blue' ? '🔵 BLUE TEAM' : '🔴 RED TEAM';
    badge.className = `px-3 py-1 rounded-full text-xs font-black ${gameState.fps.team === 'blue' ? 'bg-sky-600' : 'bg-rose-600'} text-white shadow-lg`;
  }
}

let gunMesh = null;
function rebuildGunMeshForCurrentSlot(){
  if(gunMesh){ camera.remove(gunMesh); gunMesh = null; }
  const w = getCurrentWeaponDef();
  if(!w) return;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.5),
    new THREE.MeshStandardMaterial({ color:0x1e293b, metalness:0.7, roughness:0.4 }));
  body.position.set(0.22, -0.18, -0.55); g.add(body);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.35, 8),
    new THREE.MeshStandardMaterial({ color:0x334155, metalness:0.9 }));
  barrel.rotation.x = Math.PI / 2; barrel.position.set(0.22, -0.18, -0.85); g.add(barrel);
  camera.add(g);
  gunMesh = g;
}

function startGame(mode, fromQuickJoin = false){
  if(mode !== 'fps' && mode !== 'tag' && mode !== 'prophunt') return;
  gameState.mode = mode;
  gameState.screen = 'playing';
  gameState.paused = false;
  gameState.bagOpen = false;
  gameState.score = 0;
  gameState.stats = { morphCount:0, tauntCount:0, coinsCollected:0, tagsMade:0, kills:0, deaths:0 };
  gameState.timer = getDurationForMode(mode);
  gameState.prophuntSeekerDeployed = false;
  gameState.chestSpawnTimer = 6.0;
  gameState.ammoCrateSpawnTimer = 9.0;

  if(mode === 'fps'){
    gameState.hp = gameState.maxHp = 100;
    gameState.fps.hp = 100;
    gameState.fps.maxHp = 100;
    gameState.fps.blueScore = 0;
    gameState.fps.redScore = 0;
    gameState.fps.respawnTimer = 0;
    gameState.fps.team = assignBalancedTeam();
    gameState.fps.selectedSlot = 0;
    gameState.fps.slots = [
      { kind:'weapon', itemId:'rifle' },
      { kind:'heal',   itemId:'heal25' },
      null, null, null
    ];
    gameState.fps.ammoPool = { rifle:70, smg:60, shotgun:30, sniper:20 };
    gameState.fps.magAmmo = { rifle:20, smg:30, shotgun:8, sniper:5 };
  } else if(mode === 'tag'){
    gameState.hp = 3; gameState.maxHp = 3;
    gameState.tagRole = document.getElementById('tag-role-seeker')?.classList.contains('bg-rose-600') ? 'seeker' : 'runner';
  } else if(mode === 'prophunt'){
    gameState.hp = 3; gameState.maxHp = 3;
    gameState.phRole = document.getElementById('ph-role-seeker')?.classList.contains('bg-rose-600') ? 'seeker' : 'hider';
  }

  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('title-screen').classList.remove('flex');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('hud-top').classList.remove('hidden');
  document.getElementById('controls-overlay').classList.remove('hidden');
  document.getElementById('btn-pause').classList.remove('hidden');
  document.getElementById('fps-crosshair').style.display = (mode === 'fps' || (mode === 'prophunt' && gameState.phRole === 'seeker')) ? 'block' : 'none';
  document.getElementById('fps-hud').style.display = (mode === 'fps') ? 'flex' : 'none';
  document.getElementById('fps-hotbar').classList.toggle('hidden', mode !== 'fps');
  document.getElementById('reticle-container').classList.toggle('hidden', mode === 'fps');
  document.getElementById('hud-fps-teams').classList.toggle('hidden', mode !== 'fps');
  document.getElementById('hud-fps-teams').classList.toggle('flex', mode === 'fps');
  document.getElementById('hud-hp-container').classList.toggle('hidden', mode === 'fps');
  document.getElementById('hud-fps-hp-box').classList.toggle('hidden', mode !== 'fps');
  document.getElementById('hud-fps-hp-box').classList.toggle('flex', mode === 'fps');
  document.getElementById('hud-disguise-box').classList.toggle('hidden', mode !== 'prophunt');
  document.getElementById('hud-disguise-box').classList.toggle('flex', mode === 'prophunt');
  document.getElementById('prophunt-runner-actions').classList.toggle('hidden', !(mode === 'prophunt' && gameState.phRole === 'hider'));

  build3DWorld(mode);
  player.pos.set(0, 1.6, mode === 'fps' ? 82 : 10);
  player.vel.set(0, 0, 0);
  player.fpsYaw = mode === 'fps' ? Math.PI : 0;
  player.fpsPitch = 0;

  if(mode === 'fps'){
    renderHotbarUI();
    rebuildGunMeshForCurrentSlot();
    updateFPSHUD();
  }

  document.getElementById('hud-mode-badge').textContent =
    mode === 'fps' ? 'チームFPS' : (mode === 'tag' ? '3D 鬼ごっこ' : 'かくれんぼ');
  document.getElementById('hud-timer-label').textContent = '残り時間';

  enterPlayingMode();
  sound.startBGM(mode);
  gameState.lastTime = performance.now();
  if(APP.ready) syncPresenceToServer();
  pushToast(`🎮 ${mode === 'fps' ? 'FPS' : mode === 'tag' ? '鬼ごっこ' : 'かくれんぼ'} 開始！`, 'text-emerald-300');

  if(!gameState._loopStarted){
    gameState._loopStarted = true;
    requestAnimationFrame(gameLoop);
  }
}

function endGame(won = false, backToLobby = false){
  gameState.screen = 'title';
  gameState.paused = false;
  gameState.bagOpen = false;
  leavePlayingMode();
  sound.stopBGM();
  document.getElementById('hud-top').classList.add('hidden');
  document.getElementById('controls-overlay').classList.add('hidden');
  document.getElementById('fps-crosshair').style.display = 'none';
  document.getElementById('fps-hud').style.display = 'none';
  document.getElementById('fps-hotbar').classList.add('hidden');
  document.getElementById('pause-overlay').classList.remove('show');
  document.getElementById('inventory-overlay').classList.remove('show');
  document.getElementById('btn-pause').classList.add('hidden');

  if(backToLobby){
    document.getElementById('title-screen').classList.remove('hidden');
    document.getElementById('title-screen').classList.add('flex');
    refreshLobbyMatchUI();
  } else {
    const r = document.getElementById('result-screen');
    r.classList.remove('hidden');
    document.getElementById('result-score').textContent = `${gameState.score} pt`;
    const stats = gameState.stats;
    document.getElementById('result-stats').innerHTML =
      `変身: ${stats.morphCount}回 / 口笛: ${stats.tauntCount}回<br>キル: ${stats.kills} / デス: ${stats.deaths}`;
    won ? sound.playWin() : sound.playLose();
  }
  if(APP.ready) syncPresenceToServer();
}

function gameLoop(now){
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.05, (now - (gameState.lastTime || now)) / 1000);
  gameState.lastTime = now;

  if(gameState.screen !== 'playing' || gameState.paused || gameState.bagOpen){
    renderer.render(scene, camera);
    return;
  }

  gameState.timer = Math.max(0, gameState.timer - dt);
  const min = Math.floor(gameState.timer / 60);
  const sec = Math.floor(gameState.timer % 60).toString().padStart(2, '0');
  const hudTimer = document.getElementById('hud-timer');
  if(hudTimer) hudTimer.textContent = `${min}:${sec}.${Math.floor((gameState.timer % 1) * 10)}`;

  if(gameState.timer <= 0){ endGame(gameState.score > 0); return; }

  updatePlayerMovement(dt);
  updatePickupsAndProximity(dt);
  updateCamera();
  updateRemotePlayers(dt);

  if(gameState.mode === 'fps'){
    gameState.chestSpawnTimer = (gameState.chestSpawnTimer || 0) - dt;
    if(gameState.chestSpawnTimer <= 0){ spawnSupplyChestAtRandom(); gameState.chestSpawnTimer = 6 + Math.random() * 6; }
    gameState.ammoCrateSpawnTimer = (gameState.ammoCrateSpawnTimer || 0) - dt;
    if(gameState.ammoCrateSpawnTimer <= 0){ spawnAmmoCrateAtRandom(); gameState.ammoCrateSpawnTimer = 9 + Math.random() * 8; }
    if(gameState.fps.fireCooldown > 0) gameState.fps.fireCooldown -= dt;
    if(gameState.fps.reloadTimer > 0){
      gameState.fps.reloadTimer -= dt;
      if(gameState.fps.reloadTimer <= 0) finishReload();
    }
  }

  if(APP.ready && now - (gameState._lastSync || 0) > 250){
    gameState._lastSync = now;
    syncPresenceToServer();
  }

  renderer.render(scene, camera);
}

function updatePlayerMovement(dt){
  const speed = 6.5;
  let mx = 0, mz = 0;
  if(keys['KeyW']) mz -= 1;
  if(keys['KeyS']) mz += 1;
  if(keys['KeyA']) mx -= 1;
  if(keys['KeyD']) mx += 1;
  const len = Math.hypot(mx, mz);
  if(len > 0){
    mx /= len; mz /= len;
    const yaw = (gameState.mode === 'fps' || (gameState.mode === 'prophunt' && gameState.phRole === 'seeker')) ? player.fpsYaw : camCtrl.yaw;
    const cos = Math.cos(yaw), sin = Math.sin(yaw);
    const wx = mx * cos - mz * sin;
    const wz = mx * sin + mz * cos;
    player.pos.x += wx * speed * dt;
    player.pos.z += wz * speed * dt;
  }
  if(keys['Space'] && player.onGround){ player.vel.y = 7.5; player.onGround = false; sound.playJump(); }
  player.vel.y -= 22 * dt;
  player.pos.y += player.vel.y * dt;
  if(player.pos.y <= 1.6){ player.pos.y = 1.6; player.vel.y = 0; player.onGround = true; }
  const half = ARENA_HALF - 2;
  player.pos.x = Math.max(-half, Math.min(half, player.pos.x));
  player.pos.z = Math.max(-half, Math.min(half, player.pos.z));
}

function updateCamera(){
  if(gameState.mode === 'fps' || (gameState.mode === 'prophunt' && gameState.phRole === 'seeker')){
    camera.position.copy(player.pos);
    camera.position.y = 1.6;
    const dir = new THREE.Vector3(
      -Math.sin(player.fpsYaw) * Math.cos(player.fpsPitch),
      Math.sin(player.fpsPitch),
      -Math.cos(player.fpsYaw) * Math.cos(player.fpsPitch)
    );
    camera.lookAt(camera.position.clone().add(dir));
  } else {
    const target = player.pos.clone();
    const off = new THREE.Vector3(
      Math.sin(camCtrl.yaw) * camCtrl.distance * Math.cos(camCtrl.pitch),
      camCtrl.distance * Math.sin(camCtrl.pitch),
      Math.cos(camCtrl.yaw) * camCtrl.distance * Math.cos(camCtrl.pitch)
    );
    camera.position.copy(target).add(off);
    camera.lookAt(target);
  }
}

function updateRemotePlayers(dt){
  Object.entries(remotePlayers).forEach(([uid, rp]) => {
    if(!rp.mesh){
      rp.mesh = createCharacterMesh(0x94a3b8, false, rp.team || null);
      worldGroup.add(rp.mesh);
      attachNametag(rp.mesh, rp.username || 'Player', rp.team, rp.hp, 100, 2.75, shouldShowNametagForRemote(rp));
    }
    if(rp.pos){
      rp.mesh.position.set(rp.pos.x, (rp.pos.y || 1.6) - 1.6, rp.pos.z);
      rp.mesh.rotation.y = rp.yaw || 0;
    }
    if(rp.mesh.userData.nametag){
      updateRobloxNametag(rp.mesh.userData.nametag, rp.username, rp.team, rp.hp || 100, 100);
      rp.mesh.userData.nametag.visible = shouldShowNametagForRemote(rp);
    }
  });
}

  gameState.stats.morphCount++;
  sound.playMorph();
